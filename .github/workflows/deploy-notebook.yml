name: Deploy Notebooks to GH Pages
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Convert Notebooks to HTML
        run: |
          mkdir public
          
          # 1. Convert all notebooks to HTML
          jupyter nbconvert --to html \
            --template lab \
            --no-input \
            --output-dir='public' \
            01-practical-deep-learning-for-coders/*.ipynb \
            02-deep-learning-foundations-to-stable-diffusion/*.ipynb || true

          # 2. Generate the index.html landing page
          echo "<html><head><title>Fastai Course Gallery</title>" > public/index.html
          echo "<style>body{font-family:sans-serif; line-height:1.6; padding:40px; max-width:800px; margin:auto;} a{text-decoration:none; color:#0366d6;} a:hover{text-decoration:underline;} li{margin-bottom:10px;}</style></head>" >> public/index.html
          echo "<body><h1>Deep Learning Notebooks</h1><hr><ul>" >> public/index.html
          
          # Loop through converted files and create links
          for f in public/*.html; do
            if [ "$f" != "public/index.html" ]; then
              file=$(basename "$f")
              name="${file%.*}"
              echo "<li><a href='$file'>$name</a></li>" >> public/index.html
            fi
          done
          
          echo "</ul></body></html>" >> public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This must match the folder where your HTML files are
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4