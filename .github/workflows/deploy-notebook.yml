name: Deploy Notebooks to GH Pages
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Convert Notebooks to HTML
        run: |
          mkdir -p public
          
          # Convert notebooks from both directories
          for n in 01-practical-deep-learning-for-coders/*.ipynb 02-deep-learning-foundations-to-stable-diffusion/*.ipynb; do
            [ -e "$n" ] || continue
            jupyter nbconvert --to html --template lab --no-input --output-dir='public' "$n" || echo "Failed to convert $n"
          done

          # Generate the index.html landing page
          cat > public/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>fast.ai Deep Learning Course Notebooks</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      line-height: 1.6;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 40px 20px;
                  }
                  .container {
                      max-width: 900px;
                      margin: 0 auto;
                      background: white;
                      border-radius: 12px;
                      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                      padding: 50px;
                  }
                  header {
                      text-align: center;
                      margin-bottom: 40px;
                      padding-bottom: 30px;
                      border-bottom: 3px solid #667eea;
                  }
                  h1 {
                      color: #2d3748;
                      font-size: 2.5em;
                      margin-bottom: 15px;
                      font-weight: 700;
                  }
                  .subtitle {
                      color: #4a5568;
                      font-size: 1.1em;
                      margin-bottom: 10px;
                      font-weight: 500;
                  }
                  .description {
                      color: #718096;
                      font-size: 0.95em;
                      max-width: 700px;
                      margin: 0 auto;
                  }
                  .course-section {
                      margin-bottom: 40px;
                  }
                  .course-section h2 {
                      color: #667eea;
                      font-size: 1.5em;
                      margin-bottom: 20px;
                      padding-left: 10px;
                      border-left: 4px solid #667eea;
                  }
                  ul {
                      list-style: none;
                  }
                  li {
                      margin-bottom: 12px;
                      transition: transform 0.2s;
                  }
                  li:hover {
                      transform: translateX(5px);
                  }
                  a {
                      display: block;
                      padding: 15px 20px;
                      background: #f7fafc;
                      border-radius: 8px;
                      text-decoration: none;
                      color: #2d3748;
                      border: 2px solid #e2e8f0;
                      transition: all 0.3s;
                      font-weight: 500;
                  }
                  a:hover {
                      background: #667eea;
                      color: white;
                      border-color: #667eea;
                      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
                  }
                  .empty-state {
                      padding: 30px;
                      text-align: center;
                      color: #a0aec0;
                      background: #f7fafc;
                      border-radius: 8px;
                      font-style: italic;
                  }
                  footer {
                      text-align: center;
                      margin-top: 50px;
                      padding-top: 30px;
                      border-top: 2px solid #e2e8f0;
                      color: #718096;
                      font-size: 0.9em;
                  }
                  footer a {
                      display: inline;
                      padding: 0;
                      background: none;
                      border: none;
                      color: #667eea;
                      font-weight: 600;
                  }
                  footer a:hover {
                      background: none;
                      text-decoration: underline;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>fast.ai Deep Learning Courses</h1>
                      <p class="subtitle">Practical Implementation Notebooks</p>
                      <p class="description">
                          Implementation of fast.ai deep learning courses: 
                          <strong>"Practical Deep Learning for Coders"</strong> and 
                          <strong>"From Deep Learning Foundations to Stable Diffusion"</strong>
                      </p>
                  </header>

                  <div class="course-section" id="course1-section">
                      <h2> Course 1: Practical Deep Learning for Coders</h2>
                      <ul id="course1-notebooks"></ul>
                  </div>

                  <div class="course-section" id="course2-section">
                      <h2>Course 2: Deep Learning Foundations to Stable Diffusion</h2>
                      <ul id="course2-notebooks"></ul>
                  </div>

                  <footer>
                      <p>Notebooks from <a href="https://www.fast.ai/" target="_blank">fast.ai</a> courses
                      | Built with <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>
                      | View source on <a href="https://github.com/chizkidd/fastai" target="_blank">GitHub</a></p>
                  </footer>
              </div>

              <script>
                  const course1List = document.getElementById('course1-notebooks');
                  const course2List = document.getElementById('course2-notebooks');
                  const course1Section = document.getElementById('course1-section');
                  const course2Section = document.getElementById('course2-section');
                  
          HTMLEOF
          
          # Add notebook links with source folder tracking
          echo "        const notebooks = [" >> public/index.html
          for n in 01-practical-deep-learning-for-coders/*.ipynb 02-deep-learning-foundations-to-stable-diffusion/*.ipynb; do
            [ -e "$n" ] || continue
            file=$(basename "$n" .ipynb).html
            name=$(basename "$n" .ipynb)
            folder=$(dirname "$n")
            echo "            {file: '$file', name: '$name', folder: '$folder'}," >> public/index.html
          done
          echo "        ];" >> public/index.html
          
          cat >> public/index.html << 'JSEOF'
          
          // Sort notebooks alphabetically within each course
          notebooks.sort((a, b) => a.name.localeCompare(b.name));
          
          notebooks.forEach(nb => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = nb.file;
              a.textContent = nb.name;
              li.appendChild(a);
              
              // Categorize based on source folder
              if (nb.folder === '01-practical-deep-learning-for-coders') {
                  course1List.appendChild(li);
              } else if (nb.folder === '02-deep-learning-foundations-to-stable-diffusion') {
                  course2List.appendChild(li);
              }
          });
          
          // Show empty state for sections with no notebooks
          if (course1List.children.length === 0) {
              const emptyState = document.createElement('div');
              emptyState.className = 'empty-state';
              emptyState.textContent = 'No notebooks yet - coming soon!';
              course1Section.appendChild(emptyState);
          }
          if (course2List.children.length === 0) {
              const emptyState = document.createElement('div');
              emptyState.className = 'empty-state';
              emptyState.textContent = 'No notebooks yet - coming soon!';
              course2Section.appendChild(emptyState);
          }
              </script>
          </body>
          </html>
          JSEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4